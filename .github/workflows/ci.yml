name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build BrowserFork.slnx -c Release

      - name: Test
        run: dotnet test BrowserFork.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish
        run: >
          dotnet publish src/BrowserFork.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:PublishReadyToRun=true -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: BrowserFork-win-x64
          path: dist/BrowserFork.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/BrowserFork.exe --generate-notes
