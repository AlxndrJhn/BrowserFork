name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need the commits and tags since the previous release

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # v1.2.3 tags build version 1.2.3; everything else stays at the csproj version.
      # The tray's updater compares this against the latest release's tag.
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; v="${v%%-*}"
          else v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/BrowserFork.csproj); fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build BrowserFork.slnx -c Release -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test BrowserFork.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish
        run: >
          dotnet publish src/BrowserFork.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:Version=${{ env.VERSION }} -o dist

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; if ($LASTEXITCODE) { throw "Inno Setup install failed" } }
          & $iscc /Q "/DAppVersion=$env:VERSION" installer\BrowserFork.iss
          if ($LASTEXITCODE) { throw "iscc failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: BrowserFork-win-x64
          path: |
            dist/BrowserFork.exe
            dist/BrowserFork-Setup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          .github/release-notes.sh "${{ github.ref_name }}" > notes.md
          cat notes.md
          gh release create "${{ github.ref_name }}" dist/BrowserFork-Setup.exe dist/BrowserFork.exe \
            --title "BrowserFork ${{ github.ref_name }}" --notes-file notes.md
